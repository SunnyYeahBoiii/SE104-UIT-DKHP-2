# Dev-only backing services. The apps themselves run on the host with `bun dev` (ADR-0015).
#   docker compose -f compose.dev.yml up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dkhp
      POSTGRES_PASSWORD: dkhp
      POSTGRES_DB: dkhp
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dkhp -d dkhp']
      interval: 5s
      timeout: 3s
      retries: 10
  # ADR-0013: opaque sessions. Database index 7 is reserved for this dev stack.
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '6379:6379'
  # ADR-0010: queue Redis, kept apart from cache/session Redis so eviction cannot drop a job.
  # Database index 11 is reserved for the term-phase queue.
  redis-queue:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - '6380:6379'

volumes:
  postgres-data:
